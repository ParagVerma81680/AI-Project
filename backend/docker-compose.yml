version: "3.9"

services:
  # ============================================================================
  # PostgreSQL with pgvector extension (Production Database)
  # ============================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: smartmart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartmart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartmart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartmart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # SmartMart FastAPI AI Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmart_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smartmart}
      LLM_PROVIDER: ${LLM_PROVIDER:-hosted_llama}
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen/qwen3.8-27b}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-https://api.groq.com/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Optional Local Ollama for fully offline Llama models
  # Usage: docker compose --profile local-llm up
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: smartmart_ollama
    restart: unless-stopped
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - smartmart_ollama:/root/.ollama

volumes:
  smartmart_pgdata:
    name: smartmart_pgdata
  smartmart_ollama:
    name: smartmart_ollama
